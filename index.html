<!DOCTYPE html>
<html>
<head>
	<meta name="robots" content="noindex, nofollow">
	<meta charset="utf-8">
	<link rel="icon" href="img/favicon.png" type="image/png">
	<link rel="icon" href="img/favicon-32.png" sizes="64x64" type="image/png">
	<title>Тримикр&gt;</title>
	<style type="text/css">
    	html, body {
        	margin: 0;
    	    padding: 0;
	        height: 100%;
	        background-color: #000000;
	    }
    	body {
        	text-align: center;
	    }
	    #wrapper {
    	    display: table;
	        width: 100%;
	        height: 100%;
	    }
    	#cell {
        	display: table-cell;
	        vertical-align: middle;
	        text-align: center;
	    }
	    #pic {
	        border: 0;
	    }
		#bottom {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 30px;
			text-align: center;
		}
		#bottom a {
			display: inline-block;
			margin: 0 10px;
			border: 0;
		}
		#bottom img {
			border: 0;
			vertical-align: middle;
		}
	</style>
</head>
<body>
<div id="wrapper">
    <div id="cell">
        <img id="pic" src="img/splash.jpg" alt="">
    </div>
</div>

<div id="bottom">
	<a href="https://trimicr.github.io/game.sweep205/"><img src="img/game205.png" alt=""></a>
	<a href="https://trimicr.github.io/game.agent108/"><img src="img/game108.png" alt=""></a>

</div>

</body>
</html>
